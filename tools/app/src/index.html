<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XS16_CH552T 键位映射编辑器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>XS16_CH552T 键位映射编辑器</h1>
    <span id="connStatus" class="status-badge off">未连接</span>
  </header>

  <div class="toolbar">
    <button id="btnRead">读取设备</button>
    <button id="btnWrite" class="danger">写入设备</button>
    <button id="btnDefault">恢复默认</button>
    <span class="sep"></span>
    <button id="btnImport" class="warning">导入文件</button>
    <button id="btnExportTxt">导出 .txt</button>
    <button id="btnExportBin">导出 .bin</button>
    <input type="file" id="fileInput" accept=".txt,.bin" hidden>
  </div>

  <main>
    <section class="editor">
      <div class="layers">
        <div class="layer-block">
          <div class="layer-title">主层</div>
          <div class="grid" id="gridMain"></div>
        </div>
        <div class="layer-block">
          <div class="layer-title">Fn 层</div>
          <div class="grid" id="gridFn"></div>
        </div>
      </div>
      <div class="log-panel" id="logPanel">
        <div class="log-header">
          <span>日志</span>
          <button id="btnClearLog" class="log-clear-btn">清空</button>
        </div>
        <div class="log-content" id="logContent"></div>
      </div>
    </section>
    <aside class="scene-panel">
      <div class="scene-panel-title">
        <span>场景列表</span>
      </div>
      <ul id="sceneList" class="scene-list"></ul>
      <p class="hint" id="sceneHint">点击场景项切换编辑。从下拉菜单中选择当前打开的应用，或选择"自定义..."手动输入。</p>
    </aside>
  </main>

  <div class="statusbar" id="statusbar">就绪</div>

  <!-- 编辑弹窗 -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal">
      <div class="modal-header" id="modalTitle">编辑键位</div>
      <div class="modal-body">
        <div class="mode-toggle">
          <label><input type="radio" name="editMode" value="keyboard" checked> 键盘按键</label>
          <label><input type="radio" name="editMode" value="mouse"> 鼠标动作</label>
          <label><input type="radio" name="editMode" value="deepin"> 快捷键</label>
        </div>
        <fieldset class="mod-fieldset" id="modFieldset" hidden>
          <legend>修饰符</legend>
          <div class="mod-grid" id="modGrid"></div>
        </fieldset>
        <fieldset id="mouseFieldset" hidden>
          <legend>鼠标动作</legend>
          <div class="mouse-group">
            <div class="mouse-group-label">点击</div>
            <div class="mouse-grid">
              <button class="mouse-btn" data-code="1">左键</button>
              <button class="mouse-btn" data-code="2">右键</button>
              <button class="mouse-btn" data-code="3">中键</button>
            </div>
          </div>
          <div class="mouse-group">
            <div class="mouse-group-label">移动</div>
            <div class="mouse-grid grid-4">
              <button class="mouse-btn" data-code="4">↑</button>
              <button class="mouse-btn" data-code="5">↓</button>
              <button class="mouse-btn" data-code="6">←</button>
              <button class="mouse-btn" data-code="7">→</button>
            </div>
          </div>
          <div class="mouse-group">
            <div class="mouse-group-label">滚轮</div>
            <div class="mouse-grid">
              <button class="mouse-btn" data-code="8">滚轮↑</button>
              <button class="mouse-btn" data-code="9">滚轮↓</button>
            </div>
          </div>
        </fieldset>
        <fieldset id="keycodeFieldset" hidden>
          <legend>键码</legend>
          <div class="keycode-row">
            <label>十六进制</label>
            <input type="text" id="hexInput" maxlength="4" placeholder="0x00">
            <label>名称</label>
            <input type="text" id="nameInput" list="keynamelist" placeholder="KEY_A">
            <datalist id="keynamelist"></datalist>
          </div>
        </fieldset>
        <fieldset id="deepinFieldset" hidden>
          <div class="deepin-tabs" id="deepinTabs">
            <button type="button" class="deepin-tab active" data-source="system">系统快捷键</button>
            <button type="button" class="deepin-tab" data-source="terminal">终端快捷键</button>
            <button type="button" class="deepin-tab" data-source="filemanager">文件管理器快捷键</button>
            <button type="button" class="deepin-tab" data-source="vscode">VS Code 快捷键</button>
          </div>
          <div id="deepinList"></div>
        </fieldset>
        <p class="modal-hint" id="modalHint">在键盘上按下目标键，或点击下方键盘图直接选择。</p>
        <div id="kbd104Container"></div>
      </div>
      <div class="modal-footer">
        <button id="btnCancel" type="button">取消</button>
        <button id="btnOk" class="primary" type="button">确定</button>
      </div>
    </div>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
